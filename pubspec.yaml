name: cadastro_clientes
description: "Cadastro de Clientes - Versão Estável Blindada"
publish_to: 'none'
version: 8.0.0+80

environment:
  sdk: ">=3.3.0 <3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 🔹 Pacotes 100% compatíveis com Flutter 3.19.6
  firebase_core: ^4.2.0
  cloud_firestore: ^6.0.3
  flutter_masked_text2: ^0.9.1
  mask_text_input_formatter: ^2.9.0
  intl: ^0.20.2
  font_awesome_flutter: ^10.11.0
  url_launcher: ^6.3.2
  mobile_scanner: ^6.0.2   # ✅ adicione esta linha

  qr_code_scanner:
    git:
      url: https://github.com/juliuscanute/qr_code_scanner.git
      ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
